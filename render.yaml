# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: text-santa
    runtime: node
    plan: starter            # persistent disks need a paid instance
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/santa.json
      - key: ANTHROPIC_API_KEY
        sync: false          # Render asks you for this when you create the Blueprint
      - key: DAILY_REPLIES_PER_FAMILY
        value: "300"
    disk:
      name: santa-data
      mountPath: /var/data
      sizeGB: 1
